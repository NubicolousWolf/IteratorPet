[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterator-pet"
version = "0.1.4"
requires-python = ">=3.12"
# UnityPy 只在“从本机游戏切素材”时才用；缺了也能跑（用程序内生成的图元兜底），
# 但发布版必须带上，否则第一次运行拿不到真精灵。
dependencies = ["PySide6>=6.6", "UnityPy>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.0"]

[project.scripts]
iterator-pet = "iterator_pet.main:main"
iterator-pet-launch = "iterator_pet.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iterator_pet = ["assets/*.png"]
