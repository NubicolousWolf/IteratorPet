[pytest]
testpaths = tests
# 分组见 tests/conftest.py 的 GROUPS。日常只跑被改到的那一组：
#   python -m pytest -m workshop / -m llm / -m sim / -m talk / -m ui
# 默认排掉 slow（长时间仿真，单条 20–55 s）。发布前跑真·全量：
#   python -m pytest -m ""
markers =
    sim: 仿真 / 物理 / 渲染
    ui: 窗口与绘制
    io: 素材与文件
    talk: 对话与台词
    llm: 大模型
    workshop: 角色/世界书/人偶编辑器
    slow: 长时间仿真，默认不跑
addopts = -m "not slow"
